<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-label="Pixel drone perception pipeline" shape-rendering="crispEdges">
  <defs><linearGradient id="b" x2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#082f49"/></linearGradient><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#38bdf8" stroke-opacity=".08"/></pattern></defs>
  <rect width="1200" height="180" rx="16" fill="url(#b)"/><rect width="1200" height="180" rx="16" fill="url(#g)"/>
  <g font-family="Consolas,monospace"><text x="34" y="36" fill="#67e8f9" font-size="15" font-weight="700">STAGE 01 // SENSE THE WORLD</text><text x="34" y="62" fill="#94a3b8" font-size="12">CAMERA + LIDAR + IMU → TIME SYNC → CALIBRATION → STATE ESTIMATION</text></g>
  <g transform="translate(70 90)" fill="#22d3ee"><rect x="0" y="16" width="70" height="12"/><rect x="22" width="26" height="16" fill="#a78bfa"/><rect x="-18" y="8" width="28" height="6"/><rect x="60" y="8" width="28" height="6"/><rect x="-10" y="28" width="8" height="14"/><rect x="72" y="28" width="8" height="14"/><animateTransform attributeName="transform" type="translate" values="70 90;210 82;70 90" dur="6s" repeatCount="indefinite"/></g>
  <g stroke="#22d3ee" stroke-width="2" opacity=".7"><path d="M160 128L230 168H90Z" fill="#0ea5e9" fill-opacity=".08"><animate attributeName="opacity" values=".25;.8;.25" dur="1.6s" repeatCount="indefinite"/></path></g>
  <g font-family="Consolas,monospace" font-size="12" font-weight="700" text-anchor="middle">
    <g transform="translate(360 94)"><rect x="-78" y="-26" width="156" height="52" rx="6" fill="#172554" stroke="#60a5fa"/><text y="5" fill="#dbeafe">RAW SENSORS</text></g>
    <g transform="translate(580 94)"><rect x="-78" y="-26" width="156" height="52" rx="6" fill="#2e1065" stroke="#c084fc"/><text y="5" fill="#f3e8ff">FUSION</text></g>
    <g transform="translate(800 94)"><rect x="-78" y="-26" width="156" height="52" rx="6" fill="#083344" stroke="#22d3ee"/><text y="5" fill="#cffafe">WORLD MODEL</text></g>
    <g transform="translate(1040 94)"><rect x="-88" y="-26" width="176" height="52" rx="6" fill="#052e16" stroke="#4ade80"/><text y="5" fill="#dcfce7">CONFIDENCE</text></g>
  </g>
  <g fill="#fff"><circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M438 94H502"/></circle><circle r="4"><animateMotion dur="2.4s" begin=".6s" repeatCount="indefinite" path="M658 94H722"/></circle><circle r="4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M878 94H952"/></circle></g>
  <rect x="1" y="1" width="1198" height="178" rx="15" fill="none" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/>
</svg>
